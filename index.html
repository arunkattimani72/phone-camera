<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Camera</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>

<style>
body{
  font-family:Arial,sans-serif;
  text-align:center;
  background:#111;
  color:white;
  padding:20px;
}
video{
  width:100%;
  max-width:600px;
  background:#000;
  border-radius:12px;
}
#status{
  margin:20px;
  font-size:18px;
}
</style>
</head>

<body>

<h1>📱 My Camera</h1>
<div id="status">Starting...</div>
<video id="video" autoplay playsinline muted></video>

<script>

const params = new URLSearchParams(window.location.search);
const cameraCode = params.get("camera");
const viewCode = params.get("view");

const video = document.getElementById("video");
const status = document.getElementById("status");


// CAMERA PHONE
async function startCamera(code){

  status.innerText = "Requesting camera permission...";

  try{

    const stream = await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:false
    });

    video.srcObject = stream;

    const peer = new Peer("cam-" + code);

    peer.on("open", function(){
      status.innerText = "🟢 Camera ready";
    });

    peer.on("connection", function(conn){

      conn.on("open", function(){

        status.innerText = "🟢 Viewer connected";

        const call = peer.call(conn.peer, stream);

        call.on("error", function(error){
          console.log(error);
        });

      });

    });

    peer.on("error", function(error){
      status.innerText = "Connection error";
      console.log(error);
    });

  }catch(error){

    status.innerText = "❌ Camera permission denied";
    console.log(error);

  }
}


// VIEWER PHONE
function startViewer(code){

  status.innerText = "Connecting to camera...";

  const peer = new Peer();

  peer.on("open", function(){

    const connection = peer.connect("cam-" + code);

    connection.on("open", function(){
      status.innerText = "Connected. Waiting for video...";
    });

  });

  peer.on("call", function(call){

    call.answer();

    call.on("stream", function(remoteStream){

      video.srcObject = remoteStream;

      status.innerText = "🟢 LIVE CAMERA";

    });

  });

  peer.on("error", function(error){

    status.innerText = "❌ Camera not connected";
    console.log(error);

  });

}


// START
if(cameraCode){
  startCamera(cameraCode);
}
else if(viewCode){
  startViewer(viewCode);
}
else{
  status.innerText = "No camera session selected.";
}

</script>

</body>
</html>
